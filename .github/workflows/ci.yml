name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -v

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Clang and libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev
      - name: Install fuzz harness
        env:
          CLANG_BIN: /usr/bin/clang
          CC: clang
          CXX: clang++
        run: pip install -e ".[dev,fuzz]"
      - name: Coverage-guided parser smoke tests
        run: |
          python scripts/fuzz_anubis.py gguf -runs=500 -max_len=4096
          python scripts/fuzz_anubis.py safetensors -runs=500 -max_len=4096
          python scripts/fuzz_anubis.py jinja -runs=500 -max_len=4096
