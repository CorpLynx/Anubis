[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anubis-ai"
version = "0.1.0"
description = "Security scanner and environment auditor for local AI models (GGUF, MLX, Safetensors, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anubis Contributors"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]
fuzz = [
    "atheris>=2.3.0; platform_system == 'Linux'",
]
judge = [
    "anthropic>=2.3.0",
]

[project.scripts]
anubis = "anubis.cli:app"
# Backward-compatible command name; the primary CLI is `anubis`.
localguard = "anubis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anubis = ["*.json"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff.lint]
# Pin Ruff's classic default rule set so newer Ruff releases don't change what CI enforces.
select = ["E4", "E7", "E9", "F"]
