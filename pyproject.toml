[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localguard-ai"
version = "0.1.0"
description = "Security scanner and environment auditor for local AI models (GGUF, MLX, Safetensors, Ollama)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LocalGuard Contributors"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
localguard = "localguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
